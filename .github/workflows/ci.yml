name: ci
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/install-elephant-cli.sh
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
