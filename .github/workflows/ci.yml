name: ci
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # onnxruntime-node's install script downloads a CUDA build on Linux (404 for 1.21.0);
      # CI has no GPU and the CPU build ships in the package.
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/install-elephant-cli.sh
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"
          PW_BUNDLED_CHROMIUM: "1"
